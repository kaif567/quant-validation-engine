[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-validation-engine"
version = "0.1.0"
description = "Institutional quantitative strategy validation engine"
readme = "README_USAGE.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
]

[tool.setuptools.packages.find]
include = ["validation_engine*"]
exclude = ["tests*", "scripts*", "reference_design*", "e2e_artifacts*", "test_artifacts*"]

